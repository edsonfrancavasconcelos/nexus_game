<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Raptor Strike: Heavy Fire Edition</title>
    
    <link rel="manifest" href="./assets/manifest-C-WIISkK.json">
    <meta name="theme-color" content="#020208">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script type="module" crossorigin src="./assets/index-DAhCNjog.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three-CgbjQTyu.js">
  <link rel="stylesheet" crossorigin href="./assets/index-DD2xDE7i.css">
</head>
<body>

    <div id="ui">
        <div class="hud-stat hud-score">
            <span class="hud-label">SCORE</span>
            <span id="score-val" class="hud-value-large">0</span>
        </div>
        <div class="hud-stat">
            <span class="hud-label">LEVEL</span>
            <span id="level-val" class="hud-value-large">1</span>
        </div>
        <div class="hud-progress">
            <span class="hud-label">PROGRESSO</span>
            <div class="hud-bar"><div id="level-progress-bar"></div></div>
            <span id="level-progress-label" class="hud-value">0%</span>
        </div>
        <div class="hud-stat">
            <span class="hud-label">MISSILES</span>
            <span id="missile-val" class="hud-value-large">10</span>
        </div>
        <div class="hud-charge">
            <span class="hud-label">MISSILE LOAD</span>
            <div class="hud-bar"><div id="missile-load-bar"></div></div>
        </div>
        <div class="hud-stat">
            <span class="hud-label">PDC</span>
            <span id="pdc-val" class="hud-value-large">30</span>
        </div>
        <div class="hud-pdc">
            <span class="hud-label">PDC LOAD</span>
            <div class="hud-bar"><div id="pdc-load-bar"></div></div>
        </div>
        <div class="hud-stat">
            <span class="hud-label">CHANCES</span>
            <span id="chance-val" class="hud-value-large">5</span>
        </div>
    </div>
    
    <div id="overlay">
        <div class="overlay-blur-effect"></div>
        <div class="menu-content">
            <h2 class="brand-sub">HEAVY FIRE EDITION</h2>
            <div class="logo-container">
                <span class="logo-text">RAPTOR</span>
                <span class="logo-text highlight">STRIKE</span>
            </div>
            <p class="game-lore">Pilote no limite do espaço profundo. Sobreviva à investida alienígena.</p>
            <button id="start-btn">LIGAR MOTORES DA NAVE</button>
        </div>
    </div>
    <div id="mobile-controls">
        <div id="joystick-area">
            <div id="stick"></div>
        </div>
    </div>

 <div id="nexusSelector">
    <div id="zone-header" class="zone-header">
        <span id="selected-text">ZONA 01 • SETOR ALPHA</span>
        <span class="arrow">▼</span>
    </div>

    <div id="zone-list" class="zone-list"></div>

    <div class="test-status">
        SISTEMA DE TESTE DE NÍVEIS ATIVO
    </div>
</div>

        

    <div id="cockpit-ui">
        <div id="roll-controls">
            <button id="btnRollLeft" class="game-btn">ROLL ◄</button>
            <button id="btnRollRight" class="game-btn">ROLL ►</button>
        </div>

        <button id="btnMissile" class="control-btn">
            <img src="./assets/img/missel.png" alt="Míssil" style="width: 55%; height: 55%; pointer-events: none;">
        </button>
        
        <button id="btnPDC" class="control-btn">
            <img src="./assets/img/pdc.png" alt="PDC" style="width: 55%; height: 55%; pointer-events: none;">
        </button>
        
        <button id="btnShoot" class="control-btn">
            <img src="./assets/img/atirar.png" alt="Atirar" style="width: 60%; height: 60%; pointer-events: none;">
        </button>
        
        <button id="btnPause" class="control-btn">
            <img src="./assets/img/pause.png" alt="Pausar" style="width: 50%; height: 50%; pointer-events: none;">
        </button> 
    </div>

    <div id="countdown-display" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); 
       font-size: 100px; color: #00ffff; font-family: sans-serif; display: none; z-index: 10000; text-shadow: 0 0 20px #000;">
    </div>

   <script>
    document.addEventListener('DOMContentLoaded', () => {
        const header = document.getElementById('zone-header');
        const list = document.getElementById('zone-list');
        const selectedText = document.getElementById('selected-text');

        // Gerar 100 níveis automaticamente
        for (let i = 1; i <= 100; i++) {
            const div = document.createElement('div');
            div.className = 'zone-option';
            div.dataset.value = i;
            
            // Define a lógica de nomes
            let label = `ZONA ${i.toString().padStart(2, '0')}`;
            if (i >= 51) label += " • GIGANTES TIPO 15";
            else if (i >= 31) label += " • GIGANTES TIPO 10";
            else if (i >= 21) label += " • GIGANTES TIPO 05";
            else label += " • SETOR ALPHA";
            
            div.textContent = label;

            div.addEventListener('click', () => {
                // Remove classe active de todos
                document.querySelectorAll('.zone-option').forEach(opt => opt.classList.remove('active'));
                div.classList.add('active');

                selectedText.textContent = div.textContent.trim();

                // Dispara evento para o seu jogo
                window.dispatchEvent(new CustomEvent('nivelAlterado', { 
                    detail: { nivel: i } 
                }));

                list.classList.remove('open');
                header.classList.remove('open');
            });
            list.appendChild(div);
        }

        // Toggle do menu
        header.addEventListener('click', () => {
            list.classList.toggle('open');
            header.classList.toggle('open');
        });
    });
</script>


    <style>
   #nexusSelector {
    position: absolute;    
    left: 12px;
    top: 110px;
    z-index: 9999;            
    width: 320px;
    max-width: 90vw;
    font-family: 'Orbitron', Arial, sans-serif;
}

.zone-header {
    background: linear-gradient(135deg, rgba(2, 10, 24, 0.92), rgba(4, 20, 36, 0.82));
    border: 1px solid rgba(0, 255, 255, 0.28);
    border-radius: 14px;
    padding: 14px 16px;
    color: #7fefff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-align: center;
    box-shadow: 0 0 24px rgba(0, 255, 255, 0.12);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(14px);
}

.arrow {
    transition: transform 0.3s;
    margin-left: 10px;
    user-select: none;
}

.zone-header.open .arrow {
    transform: rotate(180deg);
}

.zone-list {
    background: linear-gradient(180deg, rgba(2, 12, 24, 0.96), rgba(4, 20, 36, 0.9));
    border: 1px solid rgba(0, 255, 255, 0.18);
    border-top: none;
    border-radius: 0 0 14px 14px;
    max-height: 0;
    overflow-y: auto;
    transition: max-height 0.4s ease-out;
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
}

.zone-list.open {
    max-height: 350px;
}

.zone-list::-webkit-scrollbar {
    width: 8px;
}
.zone-list::-webkit-scrollbar-track {
    background: rgba(0, 10, 30, 0.9);
}
.zone-list::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #00ffff, #66ff66);
    border-radius: 999px;
}

.zone-option {
    padding: 12px 16px;
    color: #88ddff;
    border-bottom: 1px solid rgba(0, 100, 200, 0.28);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    font-size: 13px;
}

.zone-option:hover,
.zone-option.active {
    background: linear-gradient(90deg, rgba(0, 255, 255, 0.16), rgba(102, 255, 102, 0.12));
    color: #ffffff;
    transform: translateX(2px);
}

.test-status {
    background: rgba(255, 90, 90, 0.12);
    color: #ff9d9d;
    padding: 8px 10px;
    text-align: center;
    border: 1px solid rgba(255, 90, 90, 0.35);
    border-radius: 10px;
    font-size: 12px;
    margin-top: 10px;
    letter-spacing: 0.8px;
    pointer-events: none;
}

@media (max-width: 768px) {
    #nexusSelector {                
        left: 8px;
        width: 80%; /* Ajustado para melhor uso no mobile */
    }
    .zone-header {
        font-size: 14px;
        padding: 12px 14px;
    }
}
    </style>
</body>
</html>
